<head>
    <style>
        body{
            background-color: lightgreen;
            text-align: center;
            font-weight: bold;
        }
        .box{
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 40px;
            padding: 30px 60px 60px;
            justify-items: center;
            text-align: center;
            background-color: rgb(32, 178, 134);
        }
        .image{
            width: 250px;
            height: 250px;
            transition: transform 0.3;
        }
        .image:hover{
            transform: scale(1.1);
        }
        h1{
            font-size: 25px;
        }
        .coffee{
            background-color: lightgreen;
        }
        p{
            font-size: 22px;
        }
    </style>
</head>
<body>
    <h1>🍕~Pizza~🍝</h1>
    <div class="box">
        <div class="coffee">
            <img class="image" src="Farmhouse Pizza.png">
            <h1>Farmhouse Pizza</h1>
            <p>Price:$600</p>
        </div>
        <div class="coffee">
            <img class="image" src="Classic Margherita Pizza.png">
            <h1>Classic Margherita</h1>
            <p>Price:$550</p>
        </div>
        <div class="coffee">
            <img class="image" src="BBQ Paneer Pizza.png">
            <h1>BBQ Paneer</h1>
            <p>Price:$620</p>
        </div>
        <div class="coffee">
            <img class="image" src="BBQ  Chicken Pizza.png">
            <h1>BBQ Chicken</h1>
            <p>Price:$670</p>
        </div>
        <div class="coffee">
            <img class="image" src="Classic Chicken Pizza.png">
            <h1>Classic Chicken</h1>
            <p>Price:$650</p>
        </div>
        <div class="coffee">
            <img class="image" src="Golden Crown Pizza.png">
            <h1>Golden Crown</h1>
            <p>Price:$580</p>
        </div>
    </div>
</body>
