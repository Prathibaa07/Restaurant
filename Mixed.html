<head>
    <style>
        body{
            background-color: lightsalmon;
            text-align: center;
            font-weight: bold;
        }
        .box{
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 40px;
            padding: 30px 200px 60px;
            justify-items: center;
            text-align: center;
            background-color: rgb(236, 101, 101);
        }
        .image{
            width: 250px;
            height: 250px;
            transition: transform 0.3;
        }
        .image:hover{
            transform: scale(1.1);
        }
        h1{
            font-size: 25px;
        }
        .coffee{
            background-color: lightsalmon;
        }
        p{
            font-size: 22px;
        }
    </style>
</head>
<body>
    <h1>🍳~Mixed~🍗</h1>
    <div class="box">
        <div class="coffee">
            <img class="image" src="Creamy Mix Veg.png">
            <h1>Creamy Mix Veg</h1>
            <p>Price:$300</p>
        </div>
        <div class="coffee">
            <img class="image" src="Matar Mushroom.png">
            <h1>NMatar Mushroom</h1>
            <p>Price:$320</p>
        </div>
        <div class="coffee">
            <img class="image" src="Mushroom Do Pyaza.png">
            <h1>Mushroom Do Pyaza</h1>
            <p>Price:$320</p>
        </div>
        <div class="coffee">
            <img class="image" src="Jeera Aloo.png">
            <h1>Jeera Aloo</h1>
            <p>Price:$280</p>
        </div>
        <div class="coffee">
            <img class="image" src="Egg Bhurji.png">
            <h1>Egg Bhurji</h1>
            <p>Price:$250</p>
        </div>
        <div class="coffee">
            <img class="image" src="Egg Chury.png">
            <h1>Egg Chury</h1>
            <p>Price:$280</p>
        </div>
    </div>
</body>
