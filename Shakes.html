<head>
    <style>
        body{
            background-color: violet;
            text-align: center;
            font-weight: bold;
        }
        .box{
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 40px;
            padding: 30px 60px 60px;
            justify-items: center;
            text-align: center;
            background-color: rgb(236, 78, 236);
        }
        .image{
            width: 250px;
            height: 250px;
            transition: transform 0.3;
        }
        .image:hover{
            transform: scale(1.1);
        }
        h1{
            font-size: 25px;
        }
        .coffee{
            background-color: violet;
        }
        p{
            font-size: 22px;
        }
    </style>
</head>
<body>
    <h1>🥤~Shakes~🍫</h1>
    <div class="box">
        <div class="coffee">
            <img class="image" src="Kitkat shake.png">
            <h1>Kitkat Shake</h1>
            <p>Price:$240</p>
        </div>
        <div class="coffee">
            <img class="image" src="Vannila.png">
            <h1>Vannila Shake</h1>
            <p>Price:$200</p>
        </div>
        <div class="coffee">
            <img class="image" src="Strawberry.png">
            <h1>Strawberry Shake</h1>
            <p>Price:$210</p>
        </div>
        <div class="coffee">
            <img class="image" src="Oreo shake.png">
            <h1>Oreo Shake</h1>
            <p>Price:$230</p>
        </div>
        <div class="coffee">
            <img class="image" src="Nutella.png">
            <h1>Nutella Shake</h1>
            <p>Price:$280</p>
        </div>
        <div class="coffee">
            <img class="image" src="Chocolatte.png">
            <h1>Chocolate Shake</h1>
            <p>Price:$220</p>
        </div>
    </div>
</body>
