<head>
    <style>
        body{
            background-color: lightsalmon;
            text-align: center;
            font-weight: bold;
        }
        .box{
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 40px;
            padding: 30px 200px 60px;
            justify-items: center;
            text-align: center;
            background-color: rgb(236, 101, 101);
        }
        .image{
            width: 250px;
            height: 250px;
            transition: transform 0.3;
        }
        .image:hover{
            transform: scale(1.1);
        }
        h1{
            font-size: 25px;
        }
        .coffee{
            background-color: lightsalmon;
        }
        p{
            font-size: 22px;
        }
    </style>
</head>
<body>
    <h1>🍫~Ice Cream~🍨</h1>
    <div class="box">
        <div class="coffee">
            <img class="image" src="ice cream 3 scoop.png">
            <h1>Ice Cream 3 Scoops</h1>
            <p>Price:$80</p>
        </div>
        <div class="coffee">
            <img class="image" src="Brownie with ice cream.png">
            <h1>Brownie with IceCream</h1>
            <p>Price:$160</p>
        </div>
        <div class="coffee">
            <img class="image" src="gulab with ice cream.png">
            <h1>Gulab Jamun IceCream</h1>
            <p>Price:$120</p>
        </div>
        <div class="coffee">
            <img class="image" src="Chocolate ice cream.png">
            <h1>Chocolate Ice Cream</h1>
            <p>Price:$100</p>
        </div>
    </div>
</body>
