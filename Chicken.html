<head>
    <style>
        body{
            background-color: lightskyblue;
            text-align: center;
            font-weight: bold;
        }
        .box{
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 40px;
            padding: 30px 60px 60px;
            justify-items: center;
            text-align: center;
            background-color: rgb(22, 92, 136);
        }
        .image{
            width: 250px;
            height: 250px;
            transition: transform 0.3;
        }
        .image:hover{
            transform: scale(1.1);
        }
        h1{
            font-size: 25px;
        }
        .coffee{
            background-color: lightskyblue;
        }
        p{
            font-size: 22px;
        }
    </style>
</head>
<body>
    <h1>🍚~Chicken~🍗</h1>
    <div class="box">
        <div class="coffee">
            <img class="image" src="Butter Chicken.png">
            <h1>Butter Chicken</h1>
            <p>Price:$550</p>
        </div>
        <div class="coffee">
            <img class="image" src="Kadai Chicken.png">
            <h1>Kadai Chicken</h1>
            <p>Price:$520</p>
        </div>
        <div class="coffee">
            <img class="image" src="Rahra Chicken.png">
            <h1>Rahra Chicken</h1>
            <p>Price:$550</p>
        </div>
        <div class="coffee">
            <img class="image" src="Pahadi Chicken.png">
            <h1>WPahadi Chicken</h1>
            <p>Price:$600</p>
        </div>
    </div>
</body>
