<head>
    <style>
        body{
            background-color: lightskyblue;
            text-align: center;
            font-weight: bold;
        }
        .box{
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 40px;
            padding: 30px 60px 60px;
            justify-items: center;
            text-align: center;
            background-color: rgb(22, 92, 136);
        }
        .image{
            width: 250px;
            height: 250px;
            transition: transform 0.3;
        }
        .image:hover{
            transform: scale(1.1);
        }
        h1{
            font-size: 25px;
        }
        .coffee{
            background-color: lightskyblue;
        }
        p{
            font-size: 22px;
        }
    </style>
</head>
<body>
    <h1>🧃~Mojitos~🍋‍🟩</h1>
    <div class="box">
        <div class="coffee">
            <img class="image" src="Virgin Mojito.png">
            <h1>Virgin Mojito</h1>
            <p>Price:$180</p>
        </div>
        <div class="coffee">
            <img class="image" src="Blue lagoon mojito.png">
            <h1>Blue Lagoon</h1>
            <p>Price:$180</p>
        </div>
        <div class="coffee">
            <img class="image" src="Green gin cooler.png">
            <h1>Green Gin Cooler</h1>
            <p>Price:$180</p>
        </div>
        <div class="coffee">
            <img class="image" src="Watermelon mojito.png">
            <h1>Watermelon Mojito</h1>
            <p>Price:$180</p>
        </div>
        <div class="coffee">
            <img class="image" src="Mint mojito.png">
            <h1>Mint Mojito</h1>
            <p>Price:$180</p>
        </div>
        <div class="coffee">
            <img class="image" src="Peech Mojitos.png">
            <h1>Peech Mojito</h1>
            <p>Price:$180</p>
        </div>
    </div>
</body>
