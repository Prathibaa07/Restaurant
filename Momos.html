<head>
    <style>
        body{
            background-color: lightsalmon;
            text-align: center;
            font-weight: bold;
        }
        .box{
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 40px;
            padding: 30px 200px 60px;
            justify-items: center;
            text-align: center;
            background-color: rgb(236, 101, 101);
        }
        .image{
            width: 250px;
            height: 250px;
            transition: transform 0.3;
        }
        .image:hover{
            transform: scale(1.1);
        }
        h1{
            font-size: 25px;
        }
        .coffee{
            background-color: lightsalmon;
        }
        p{
            font-size: 22px;
        }
    </style>
</head>
<body>
    <h1>🌿~Momos~🍗</h1>
    <div class="box">
        <div class="coffee">
            <img class="image" src="Veg Manchurian.png">
            <h1>Veg Manchurian</h1>
            <p>Price:$280</p>
        </div>
        <div class="coffee">
            <img class="image" src="Chicken Manchurian.png">
            <h1>Chicken Manchurian</h1>
            <p>Price:$320</p>
        </div>
        <div class="coffee">
            <img class="image" src="Veg Momos.png">
            <h1>Veg Momos</h1>
            <p>Price:$200</p>
        </div>
        <div class="coffee">
            <img class="image" src="Chicken Momos.png">
            <h1>Chicken Momos</h1>
            <p>Price:$250</p>
        </div>
    </div>
</body>
