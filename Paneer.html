<head>
    <style>
        body{
            background-color: violet;
            text-align: center;
            font-weight: bold;
        }
        .box{
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 40px;
            padding: 30px 60px 60px;
            justify-items: center;
            text-align: center;
            background-color: rgb(236, 78, 236);
        }
        .image{
            width: 250px;
            height: 250px;
            transition: transform 0.3;
        }
        .image:hover{
            transform: scale(1.1);
        }
        h1{
            font-size: 25px;
        }
        .coffee{
            background-color: violet;
        }
        p{
            font-size: 22px;
        }
    </style>
</head>
<body>
    <h1>🥞~Paneer Dish~🧇</h1>
    <div class="box">
        <div class="coffee">
            <img class="image" src="Shahi Paneer.png">
            <h1>Shahi Paneer</h1>
            <p>Price:$350</p>
        </div>
        <div class="coffee">
            <img class="image" src="Kadai Paneer.png">
            <h1>Kadai Paneer</h1>
            <p>Price:$350</p>
        </div>
        <div class="coffee">
            <img class="image" src="Paneer do pyaza.png">
            <h1>Paneer Do Pyaza</h1>
            <p>Price:$350</p>
        </div>
        <div class="coffee">
            <img class="image" src="Paneer Butter Masala.png">
            <h1>Paneer Butter Masala</h1>
            <p>Price:$400</p>
        </div>
        <div class="coffee">
            <img class="image" src="Mutter Paneer.png">
            <h1>Mutter Paneer</h1>
            <p>Price:$350</p>
        </div>
        <div class="coffee">
            <img class="image" src="Paneer Burji.png">
            <h1>Paneer Bhurji</h1>
            <p>Price:$350</p>
        </div>
    </div>
</body>
