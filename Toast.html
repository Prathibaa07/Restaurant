<head>
    <style>
        body{
            background-color: lightsalmon;
            text-align: center;
            font-weight: bold;
        }
        .box{
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 40px;
            padding: 30px 200px 60px;
            justify-items: center;
            text-align: center;
            background-color: rgb(236, 101, 101);
        }
        .image{
            width: 250px;
            height: 250px;
            transition: transform 0.3;
        }
        .image:hover{
            transform: scale(1.1);
        }
        h1{
            font-size: 25px;
        }
        .coffee{
            background-color: lightsalmon;
        }
        p{
            font-size: 22px;
        }
    </style>
</head>
<body>
    <h1>🍫~Toast~🍞</h1>
    <div class="box">
        <div class="coffee">
            <img class="image" src="Butter Toast.png">
            <h1>Butter Toast</h1>
            <p>Price:$50</p>
        </div>
        <div class="coffee">
            <img class="image" src="Jam Toast.png">
            <h1>Jam Toast</h1>
            <p>Price:$60</p>
        </div>
        <div class="coffee">
            <img class="image" src="Peanut Butter.png">
            <h1>Peanut Toast</h1>
            <p>Price:$70</p>
        </div>
        <div class="coffee">
            <img class="image" src="Nutella Toast.png">
            <h1>Nutella Toast</h1>
            <p>Price:$80</p>
        </div>
