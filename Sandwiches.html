<head>
    <style>
        body{
            background-color: lightsalmon;
            text-align: center;
            font-weight: bold;
        }
        .box{
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 40px;
            padding: 30px 200px 60px;
            justify-items: center;
            text-align: center;
            background-color: rgb(236, 101, 101);
        }
        .image{
            width: 250px;
            height: 250px;
            transition: transform 0.3;
        }
        .image:hover{
            transform: scale(1.1);
        }
        h1{
            font-size: 25px;
        }
        .coffee{
            background-color: lightsalmon;
        }
        p{
            font-size: 22px;
        }
    </style>
</head>
<body>
    <h1>🥪~Sandwiches~🍞</h1>
    <div class="box">
        <div class="coffee">
            <img class="image" src="Veg Grilled Sandwich.png">
            <h1>Veg Grilled Sandwich</h1>
            <p>Price:$250</p>
        </div>
        <div class="coffee">
            <img class="image" src="Thandoori Paneer Sandwich.png">
            <h1>Thandoori Paneer</h1>
            <p>Price:$270</p>
        </div>
        <div class="coffee">
            <img class="image" src="Thandoori Chicken Sandwiches.png">
            <h1>Thandoori Chicken</h1>
            <p>Price:$320</p>
        </div>
        <div class="coffee">
            <img class="image" src="Classic Club Sandwich.png">
            <h1>Classic Club Sandwich</h1>
            <p>Price:$320</p>
        </div>
        <div class="coffee">
            <img class="image" src="Paneer wrap.png">
            <h1>Paneer Wrap</h1>
            <p>Price:$240</p>
        </div>
        <div class="coffee">
            <img class="image" src="Veg wrap.png">
            <h1>Veg Wrap</h1>
            <p>Price:$220</p>
        </div>
        <div class="coffee">
            <img class="image" src="Chicken Wrap.png">
            <h1>Chicken Wrap</h1>
            <p>Price:$280</p>
        </div>
        <div class="coffee">
            <img class="image" src="Paneer BBQ.png">
            <h1>Paneer BBQ</h1>
            <p>Price:$280</p>
        </div>
        <div class="coffee">
            <img class="image" src="Chicken BBQ.png">
            <h1>Chicken BBQ</h1>

        </div>
    </div>
</body>
