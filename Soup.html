<head>
    <style>
        body{
            background-color: lightsalmon;
            text-align: center;
            font-weight: bold;
        }
        .box{
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 40px;
            padding: 30px 60px 60px;
            justify-items: center;
            text-align: center;
            background-color: rgb(236, 101, 101);
        }
        .image{
            width: 250px;
            height: 250px;
            transition: transform 0.3;
        }
        .image:hover{
            transform: scale(1.1);
        }
        h1{
            font-size: 25px;
        }
        .coffee{
            background-color: lightsalmon;
        }
        p{
            font-size: 22px;
        }
    </style>
</head>
<body>
    <h1>🍅~Soup~🍲</h1>
    <div class="box">
        <div class="coffee">
            <img class="image" src="Manchow Soup.png">
            <h1>Manchow Soup</h1>
            <p>Price:$180</p>
        </div>
        <div class="coffee">
            <img class="image" src="Tomato Soup.png">
            <h1>Tomato Soup</h1>
            <p>Price:$160</p>
        </div>
        <div class="coffee">
            <img class="image" src="Corn and Coriander Soup.png">
            <h1>Corn and Coriander Soup</h1>
            <p>Price:$160</p>
        </div>
        <div class="coffee">
            <img class="image" src="Culinery Ginger Soup.png">
            <h1>Culinery Ginger Soup</h1>
            <p>Price:$170</p>
        </div>
        <div class="coffee">
            <img class="image" src="Chicken Manchow Soup.png">
            <h1>Chicken Manchow Soup</h1>
            <p>Price:$210</p>
        </div>
        <div class="coffee">
            <img class="image" src="Chincken Soup.png">
            <h1>Chicken and Sour soup</h1>
            <p>Price:$200</p>
        </div>
    </div>
</body>
