<head>
    <style>
        body{
            background-color: lightsalmon;
            text-align: center;
            font-weight: bold;
        }
        .box{
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 40px;
            padding: 30px 200px 60px;
            justify-items: center;
            text-align: center;
            background-color: rgb(236, 101, 101);
        }
        .image{
            width: 250px;
            height: 250px;
            transition: transform 0.3;
        }
        .image:hover{
            transform: scale(1.1);
        }
        h1{
            font-size: 25px;
        }
        .coffee{
            background-color: lightsalmon;
        }
        p{
            font-size: 22px;
        }
    </style>
</head>
<body>
    <h1>🍗~Noodles~🍜</h1>
    <div class="box">
        <div class="coffee">
            <img class="image" src="Veg noodles.png">
            <h1>Veg Noodles</h1>
            <p>Price:$240</p>
        </div>
        <div class="coffee">
            <img class="image" src="Chilly Garlic Noodles.png">
            <h1>Chilly Garlic Noodles</h1>
            <p>Price:$270</p>
        </div>
        <div class="coffee">
            <img class="image" src="Chicken Noodles.png">
            <h1>Chicken Noodles</h1>
            <p>Price:$300</p>
        </div>
        <div class="coffee">
            <img class="image" src="Egg Noodles.png">
            <h1>Egg Noodles</h1>
            <p>Price:$280</p>
        </div>
    </div>
</body>
