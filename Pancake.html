<head>
    <style>
        body{
            background-color: lightsalmon;
            text-align: center;
            font-weight: bold;
        }
        .box{
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 40px;
            padding: 30px 200px 60px;
            justify-items: center;
            text-align: center;
            background-color: rgb(236, 101, 101);
        }
        .image{
            width: 250px;
            height: 250px;
            transition: transform 0.3;
        }
        .image:hover{
            transform: scale(1.1);
        }
        h1{
            font-size: 25px;
        }
        .coffee{
            background-color: lightsalmon;
        }
        p{
            font-size: 22px;
        }
    </style>
</head>
<body>
    <h1>🧈~Pancake~🥞</h1>
    <div class="box">
        <div class="coffee">
            <img class="image" src="Blueberry Pancake.png">
            <h1>Blueberry Pancake</h1>
            <p>Price:$350</p>
        </div>
        <div class="coffee">
            <img class="image" src="Nutella Pancake.png">
            <h1>Nutella Pancake</h1>
            <p>Price:$320</p>
        </div>
        <div class="coffee">
            <img class="image" src="Honey Pancake.png">
            <h1>Honey Pancake</h1>
            <p>Price:$280</p>
        </div>
        <div class="coffee">
            <img class="image" src="Maple Syrup Pancake.png">
            <h1>Chicken and Sour soup</h1>
            <p>Price:$260</p>
        </div>
    </div>
</body>
