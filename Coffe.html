<head>
    <style>
        body{
            background-color: rgb(223, 182, 128);
        }.box{
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 40px;
            padding: 30px 60px 60px;
            justify-items: center;
            text-align: center;
            background-color: rgb(248, 215, 165);
        }
        .image{
            width: 250px;
            height: 250px;
            transition: transform 0.3;
        }
        .image:hover{
            transform: scale(1.1);
        }
        h1{
            font-size: 25px;
        }
        .coffee{
            background-color:burlywood;
        }
        p{
            font-size: 22px;
        }
    </style>
</head>
<body>
    <center>
        <h1>☕~Coffee~😘</h1>
    </center>
    <div class="box">
        <div class="coffee">
            <img class="image" src="Cappuccino.png">
            <h1>Cappuccino</h1>
            <p>Price:$140</p>
        </div>
        <div class="coffee">
            <img class="image" src="Vennila Latte.png">
            <h1>Vennila Latte</h1>
            <p>Price:$200</p>
        </div>
        <div class="coffee">
            <img class="image" src="Signature hot chocolate.png">
            <h1>Signature Hot Cappuccino</h1>
            <p>Price:$180</p>
        </div>
        <div class="coffee">
            <img class="image" src="Cafe mocha.png">
            <h1>Cafe Mocha</h1>
            <p>Price:$180</p>
        </div>
        <div class="coffee">
            <img class="image" src="Black coffee.png">
            <h1>Black Coffee</h1>
            <p>Price:$80</p>
        </div>
        <div class="coffee">
            <img class="image" src="Vennila cappuccino.png">
            <h1>Vennila Cappuccino</h1>
            <p>Price:$180</p>
        </div>
    </div>
</body>
